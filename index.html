/*

*/


let preguntas = [];

let pregunta = 0;

let puntos = 0;


/*
    Esta lista guarda los residuos que
    todavía NO han aparecido.
*/

let residuosDisponibles = [];



/*
====================================================
PREPARAR PARTIDA
====================================================
*/


function prepararJuego() {


    /*
        Si ya no quedan suficientes residuos,
        volvemos a meter todos en la bolsa.
    */

    if (residuosDisponibles.length < 10) {

        residuosDisponibles = [...residuos];


        /*
            Revolver los residuos
            usando Fisher-Yates.
        */

        for (
            let i = residuosDisponibles.length - 1;
            i > 0;
            i--
        ) {

            let j =
                Math.floor(
                    Math.random() * (i + 1)
                );


            let temporal =
                residuosDisponibles[i];


            residuosDisponibles[i] =
                residuosDisponibles[j];


            residuosDisponibles[j] =
                temporal;

        }

    }


    /*
        Sacamos 10 residuos.
    */

    preguntas =
        residuosDisponibles.splice(0, 10);


    pregunta = 0;

    puntos = 0;


    document.getElementById("puntos").textContent =
        puntos;


    document.getElementById("juego").style.display =
        "block";


    document.getElementById("final").style.display =
        "none";


    mostrarPregunta();

}



/*
====================================================
MOSTRAR PREGUNTA
====================================================
*/


function mostrarPregunta() {


    document.getElementById("emoji").textContent =
        preguntas[pregunta].emoji;


    document.getElementById("nombre").textContent =
        preguntas[pregunta].nombre;


    document.getElementById("numero").textContent =
        pregunta + 1;


    document.getElementById("mensaje").innerHTML =
        "";


    document.getElementById("siguiente").style.display =
        "none";


    /*
        Activar todos los botones.
    */

    let botones =
        document.querySelectorAll(".botones button");


    botones.forEach(function(boton) {

        boton.disabled = false;

        boton.style.opacity = "1";

    });

}



/*
====================================================
RESPONDER
====================================================
*/


function responder(respuesta) {


    let mensaje =
        document.getElementById("mensaje");


    /*
        Si la respuesta es correcta.
    */

    if (
        respuesta ===
        preguntas[pregunta].respuesta
    ) {


        puntos += 10;


        mensaje.innerHTML =
            "✅ ¡Correcto! <b>+10 puntos</b>";


        mensaje.style.color =
            "green";

    }


    /*
        Si la respuesta es incorrecta.
    */

    else {


        puntos -= 5;


        let correcta =
            preguntas[pregunta].respuesta;


        let textoCorrecto =
            "";


        /*
            Convertir la respuesta
            a texto fácil de leer.
        */

        if (correcta === "organico") {

            textoCorrecto =
                "🟢 Orgánico";

        }


        else if (correcta === "reciclable") {

            textoCorrecto =
                "🔵 Reciclable";

        }


        else if (correcta === "no") {

            textoCorrecto =
                "⚫ No reciclable";

        }


        else if (correcta === "especial") {

            textoCorrecto =
                "🔴 Especial";

        }


        mensaje.innerHTML =

            "❌ ¡Incorrecto! <b>-5 puntos</b><br>" +

            "💡 La respuesta correcta era: " +

            "<b>" + textoCorrecto + "</b>";


        mensaje.style.color =
            "#d32f2f";

    }


    /*
        Actualizar puntos.
    */

    document.getElementById("puntos").textContent =
        puntos;


    /*
        Mostrar botón siguiente.
    */

    document.getElementById("siguiente").style.display =
        "block";


    /*
        Desactivar botones para evitar
        responder varias veces.
    */

    let botones =
        document.querySelectorAll(".botones button");


    botones.forEach(function(boton) {

        boton.disabled = true;

        boton.style.opacity = "0.55";

    });

}



/*
====================================================
SIGUIENTE PREGUNTA
====================================================
*/


function siguientePregunta() {


    pregunta++;


    if (pregunta >= preguntas.length) {

        terminarJuego();

    }

    else {

        mostrarPregunta();

    }

}



/*
====================================================
TERMINAR JUEGO
====================================================
*/


function terminarJuego() {


    document.getElementById("juego").style.display =
        "none";


    document.getElementById("final").style.display =
        "block";


    document.getElementById("resultado").textContent =
        puntos;


    /*
        Mensaje dependiendo de la puntuación.
    */


    if (puntos >= 90) {

            "🌎 ¡INCREÍBLE! Eres un experto en reciclaje.";


    }


    else if (puntos >= 70) {

            "♻️ ¡Excelente trabajo! Sabes separar muy bien los residuos.";


    }


    else if (puntos >= 50) {

            "👍 ¡Muy bien! Solo necesitas practicar un poco más.";


    }


    else {


        document.getElementById("comentario").textContent =

            "🌱 ¡Sigue practicando! Cada pequeño esfuerzo ayuda al planeta.";

    }

}



/*

}
